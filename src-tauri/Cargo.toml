[package]
name = "zkey-debouncer"
version = "0.1.0"
description = "Filters mechanical-keyboard chatter system-wide"
authors = ["ZKeyDebouncer contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows installs and supervises its own low-level hook, so it can reinstall
# one that the system removed silently. See src/hook_windows.rs.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
rdev = { version = "0.5", features = ["unstable_grab"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
